# OSV-Scanner configuration (scripts/security-check.sh,
# .github/workflows/security.yml): `osv-scanner scan source --config osv-scanner.toml ...`.
#
# Each ignore names the advisory, why it does not apply or cannot be fixed
# yet, and an `ignoreUntil` date at most six months out, so it comes back for
# review instead of being forgotten. Keep the Rust entries in step with
# deny.toml's [advisories] ignore list.

# serde_yaml / unsafe-libyaml: "unmaintained" notice, not a vulnerability.
# Same as deny.toml; a move to a maintained YAML parser is planned.
[[IgnoredVulns]]
id = "RUSTSEC-2024-0449"
ignoreUntil = 2027-05-11
reason = "serde_yaml/unsafe-libyaml unmaintained (no CVE); migration planned, mirrored in deny.toml"

# ttf-parser through cosmic-text/fontdb (atalanta-headless): "unmaintained"
# notice; its replacement needs cosmic-text to move first. Same as deny.toml.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0192"
ignoreUntil = 2027-05-11
reason = "ttf-parser unmaintained via cosmic-text (no CVE); no upgrade yet, mirrored in deny.toml"

# chrono: an "unmaintained" notice (2026-11-20) with no safe upgrade, used for
# timestamps in core, ios and the reporters. Same as deny.toml.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0543"
ignoreUntil = 2027-05-20
reason = "chrono unmaintained (no CVE); no upgrade yet, migration not started, mirrored in deny.toml"

# minimatch 10 (globparts amplification DoS) in the inspector frontend's
# lint tooling only: typescript-eslint 8.72.2 (latest) pins minimatch ^10 and
# the fix is minimatch 11. eslint runs on the developer's own source globs,
# never on untrusted input, and nothing of it ships in dist/. Moderate;
# `npm audit --audit-level=high` passes. Drop when typescript-eslint moves.
[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-02-11
reason = "dev-only (eslint/typescript-eslint), no fixed version inside typescript-eslint's ^10 range; not shipped"
