[package]
name = "velocity-explore"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
keywords = ["testing", "ai", "agent", "mobile", "e2e"]
categories = ["development-tools::testing"]
description = "velocity explore: an AI agent works through a goal on a device once and writes a deterministic YAML test that replays with no model calls"

# Its own crate because the loop drives the deterministic executor
# (velocity-core), which itself depends on velocity-nl: the loop can't live
# in velocity-nl without a dependency cycle.
[dependencies]
velocity-common = { workspace = true }
velocity-core = { workspace = true }
velocity-nl = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
png = { workspace = true }

[features]
# The fake app (`testkit`) the integration tests drive; not shipped in the
# library otherwise (review 06 #8).
testkit = []

[dev-dependencies]
velocity-explore = { path = ".", features = ["testkit"] }
# test-util: the explore tests that wait for a late screen run on tokio's
# paused clock, not wall time (review 07 H3).
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }

[lints]
workspace = true
