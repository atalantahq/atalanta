[package]
name = "atalanta-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
keywords = ["testing", "browser", "cdp", "chrome", "automation"]
categories = ["development-tools::testing"]
description = "Web browser driver for Atalanta using Chrome DevTools Protocol"

[dependencies]
atalanta-common = { workspace = true }
chromiumoxide = { version = "0.9", default-features = false, features = ["bytes"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
# The cross-origin frames' own DevTools connection (W4, `frames.rs`): the
# same crate and features chromiumoxide uses, so nothing new is built.
async-tungstenite = { version = "0.35", features = ["tokio-runtime"] }

[lints]
workspace = true
