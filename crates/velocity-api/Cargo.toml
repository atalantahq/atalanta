[package]
name = "velocity-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
keywords = ["testing", "api", "http", "rest", "jsonpath"]
categories = ["development-tools::testing"]
description = "API testing for Velocity: runs `http` steps (request, JSONPath checks, captures for later steps) inside UI tests or in suites that need no device"

[dependencies]
velocity-common = { workspace = true }
# A cookie jar per test: a login's session cookie reaches the next request.
reqwest = { workspace = true, features = ["cookies"] }
serde_json = { workspace = true }
# RFC 9535 JSONPath, checked against the standard's compliance suite; uses
# the `regex` crate for `match()`/`search()` filters.
serde_json_path = "0.7"
regex = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
# `velocity api scaffold` reads OpenAPI documents (YAML or JSON) and
# writes suites.
serde_yaml = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
