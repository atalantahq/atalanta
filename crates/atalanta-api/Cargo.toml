[package]
name = "atalanta-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
keywords = ["testing", "api", "http", "rest", "jsonpath"]
categories = ["development-tools::testing"]
description = "API testing for Atalanta: runs `http` steps (request, JSONPath checks, captures for later steps) inside UI tests or in suites that need no device"

[dependencies]
atalanta-common = { workspace = true }
serde_json = { workspace = true }
# RFC 9535 JSONPath, checked against the standard's compliance suite; uses
# the `regex` crate for `match()`/`search()` filters.
serde_json_path = "0.7"
regex = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
# `atalanta api scaffold` reads OpenAPI documents (YAML or JSON) and
# writes suites.
serde_yaml = { workspace = true }
serde = { workspace = true }
# `exchange` builds the request: the url's query string and a form body.
url = "2"
serde_urlencoded = "0.7"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# A cookie jar per test: a login's session cookie reaches the next request.
reqwest = { workspace = true, features = ["cookies"] }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# custom_ca.rs: the TLS server the test CA is checked against.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[lints]
workspace = true
