[package]
name = "velocity-headless"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
keywords = ["testing", "headless", "rendering", "android", "ios"]
categories = ["development-tools::testing", "rendering"]
description = "Headless rendering engine for Velocity — CPU-only layout and pixel rendering for Android XML and iOS XIB"

[dependencies]
velocity-common = { workspace = true }

# Graphics & layout
tiny-skia = "0.11.4"
taffy = "0.9.2"
cosmic-text = "0.16.0"
fontdb = { version = "0.23", default-features = false }

# Android adapter
zip = { version = "2", default-features = false, features = ["deflate"] }

# iOS adapter (quick-xml already in workspace)
quick-xml = { workspace = true }
plist = "1"

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Utilities
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Decodes rendered screenshots in tests/scrolling.rs.
png = { workspace = true }
# Drives `scrollUntilVisible` through the real executor in tests/scrolling.rs.
velocity-core = { workspace = true }

[lints]
workspace = true
