# cargo-deny configuration for Atalanta.
#
#   cargo deny check licenses advisories bans sources
#
# Atalanta is Apache-2.0. The allow-list below is the set of licenses that
# actually occur in Cargo.lock (see docs/licenses/THIRD-PARTY-RUST.md), all of
# them permissive and compatible with shipping a single Apache-2.0 binary.
# Anything new (in particular GPL/LGPL/AGPL/SSPL or an unlicensed crate)
# fails the check and has to be looked at by a human before it is allowed.

[graph]
all-features = true

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
[advisories]
# RustSec advisory database (fetched read-only into the cargo-deny cache).
db-urls = ["https://github.com/rustsec/advisory-db"]
# Unmaintained crates are reported for the whole graph; yanked crates fail.
unmaintained = "all"
yanked = "deny"
ignore = [
    # Both are "unmaintained" notices with no safe upgrade, not vulnerabilities.
    # serde_yaml (0.9.34+deprecated) is still the DSL's YAML parser; moving to a
    # maintained parser that reports spans is in docs/research/PLAN-v3.md.
    { id = "RUSTSEC-2024-0449", reason = "serde_yaml unmaintained; migration tracked in PLAN-v3" },
    # ttf-parser, through cosmic-text/fontdb in the headless renderer. Its
    # suggested replacement (skrifa) needs cosmic-text to move first.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained via cosmic-text; no upgrade yet" },
    # chrono (2026-11-20): an "unmaintained" notice with no safe upgrade, used
    # for timestamps in core, ios and the reporters. Moving to jiff or time is
    # a separate change; revisit when the advisory names a successor.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; no upgrade yet, migration not started" },
]

# ---------------------------------------------------------------------------
[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    # webpki-roots: the Mozilla CA bundle as data, permissive.
    "CDLA-Permissive-2.0",
]

# Weak (file-level) copyleft, allowed only for the named crate. colored is
# used unmodified as a library; MPL-2.0 obligations apply only to changes to
# colored's own source files. Replacing it (owo-colors / anstyle, both
# MIT/Apache) would remove the exception entirely.
exceptions = [
    { allow = ["MPL-2.0"], crate = "colored" },
]

# Dual-licensed crates that also offer a copyleft option (self_cell:
# "Apache-2.0 OR GPL-2.0-only", r-efi: "MIT OR Apache-2.0 OR
# LGPL-2.1-or-later") pass through their permissive alternative; GPL-2.0 and
# LGPL are deliberately NOT in the allow-list.

[licenses.private]
# The workspace crates are Apache-2.0 via license.workspace; still check them.
ignore = false

# ---------------------------------------------------------------------------
[bans]
# A second version of a crate fails the check unless it is accepted below,
# so a new duplicate is a reviewed diff, not one more line of warning noise.
# Each entry names the older copy (a semver requirement, so a patch bump
# doesn't need an edit) and the dependency that pins it. Drop an entry when
# its upstream moves; cargo-deny then reports it as unused.
multiple-versions = "deny"
skip = [
    # chromiumoxide 0.9 (atalanta-web) uses reqwest 0.13 with no features at
    # all (`cargo tree -e features -i reqwest@0.13`): plain HTTP to the local
    # DevTools endpoint, no TLS stack, cookies or proxy settings of its own.
    # Everything else, with the TLS choices in Cargo.toml, is reqwest 0.12.
    # Move atalanta-api/core/nl to 0.13 to make it one copy.
    { crate = "reqwest@0.12", reason = "chromiumoxide 0.9 needs 0.13 (featureless, local DevTools only)" },
    { crate = "base64@0.22", reason = "axum and reqwest 0.12; reqwest 0.13 (chromiumoxide) has 0.23" },
    # tiny-skia 0.11 (atalanta-headless) still uses png 0.17, and png 0.17 bitflags 1.
    { crate = "png@0.17", reason = "tiny-skia 0.11 (atalanta-headless)" },
    { crate = "bitflags@1", reason = "png 0.17 through tiny-skia 0.11" },
    # cosmic-text 0.16 (atalanta-headless) pulls an older skrifa through swash.
    { crate = "skrifa@0.37", reason = "swash 0.2 through cosmic-text 0.16 (atalanta-headless)" },
    { crate = "read-fonts@0.35", reason = "skrifa 0.37 through swash/cosmic-text" },
    # getrandom/rand: ring 0.17 is on 0.2; tungstenite 0.28 on rand 0.9
    # (getrandom 0.3, r-efi 5); proptest on rand 0.10 (getrandom 0.4).
    { crate = "getrandom@0.2", reason = "ring 0.17 (rustls)" },
    { crate = "getrandom@0.3", reason = "rand_core 0.9 through tungstenite 0.28" },
    { crate = "rand_core@0.9", reason = "rand 0.9 through tungstenite 0.28" },
    { crate = "r-efi@5", reason = "getrandom 0.3 (UEFI only; never built for Atalanta's targets)" },
    # tokio-macros 2.7 has moved to syn 3; most proc-macros are still on syn 2.
    { crate = "syn@2", reason = "most proc-macros; tokio-macros is on syn 3" },
    # Windows-only crates, never built for Atalanta's targets.
    { crate = "windows-sys@0.52", reason = "ring 0.17 (Windows only)" },
    { crate = "windows-sys@0.59", reason = "colored 2 (Windows only)" },
]
# The workspace crates depend on each other through [workspace.dependencies]
# with both a path and an exact version (they are published together), so
# there are no wildcard requirements.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    # Keep the binary free of the platform TLS stack (rustls only).
    { crate = "openssl-sys", reason = "rustls only; no OpenSSL to link or ship" },
    { crate = "native-tls", reason = "rustls only; no OpenSSL to link or ship" },
]

# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
