# cargo-deny configuration for Velocity.
#
#   cargo deny check licenses advisories bans sources
#
# Velocity is AGPL-3.0-only. The allow-list below is that licence (for the
# workspace's own crates) plus the set of licenses that actually occur in
# Cargo.lock (see docs/licenses/THIRD-PARTY-RUST.md), all of them permissive
# and compatible with shipping the binary under the AGPL.
# Anything new (in particular GPL/LGPL/SSPL or an unlicensed crate)
# fails the check and has to be looked at by a human before it is allowed.

[graph]
all-features = true

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
[advisories]
# RustSec advisory database (fetched read-only into the cargo-deny cache).
db-urls = ["https://github.com/rustsec/advisory-db"]
# Unmaintained crates are reported for the whole graph; yanked crates fail.
unmaintained = "all"
yanked = "deny"
ignore = [
    # Both are "unmaintained" notices with no safe upgrade, not vulnerabilities.
    # serde_yaml (0.9.34+deprecated) is still the DSL's YAML parser; moving to a
    # maintained parser that reports spans is in docs/research/PLAN-v3.md.
    { id = "RUSTSEC-2024-0449", reason = "serde_yaml unmaintained; migration tracked in PLAN-v3" },
    # ttf-parser, through cosmic-text/fontdb in the headless renderer. Its
    # suggested replacement (skrifa) needs cosmic-text to move first.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained via cosmic-text; no upgrade yet" },
]

# ---------------------------------------------------------------------------
[licenses]
confidence-threshold = 0.93
allow = [
    # Velocity's own crates (license.workspace).
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    # webpki-roots: the Mozilla CA bundle as data, permissive.
    "CDLA-Permissive-2.0",
]

# Weak (file-level) copyleft, allowed only for the named crate. colored is
# used unmodified as a library; MPL-2.0 obligations apply only to changes to
# colored's own source files. Replacing it (owo-colors / anstyle, both
# MIT/Apache) would remove the exception entirely.
exceptions = [
    { allow = ["MPL-2.0"], crate = "colored" },
]

# Dual-licensed crates that also offer a copyleft option (self_cell:
# "Apache-2.0 OR GPL-2.0-only", r-efi: "MIT OR Apache-2.0 OR
# LGPL-2.1-or-later") pass through their permissive alternative; GPL-2.0 and
# LGPL are deliberately NOT in the allow-list.

[licenses.private]
# The workspace crates are AGPL-3.0-only via license.workspace; still check them.
ignore = false

# ---------------------------------------------------------------------------
[bans]
# Duplicate versions are common in a graph this size (reqwest 0.12/0.13,
# png 0.17/0.18, windows-sys ...). Warn, do not fail.
multiple-versions = "warn"
# The workspace crates depend on each other through [workspace.dependencies]
# with both a path and an exact version (they are published together), so
# there are no wildcard requirements.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    # Keep the binary free of the platform TLS stack (rustls only).
    { crate = "openssl-sys", reason = "rustls only; no OpenSSL to link or ship" },
    { crate = "native-tls", reason = "rustls only; no OpenSSL to link or ship" },
]

# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
