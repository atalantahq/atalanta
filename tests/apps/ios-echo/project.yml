name: VelocityEcho
options:
  bundleIdPrefix: dev.velocity
  deploymentTarget:
    iOS: "15.0"
targets:
  VelocityEcho:
    type: application
    platform: iOS
    sources: Sources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Velocity Echo
        PRODUCT_BUNDLE_IDENTIFIER: dev.velocity.echo
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1,2"
