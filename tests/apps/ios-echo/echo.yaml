# Checks that Atalanta's launchApp arguments reach an iOS app as launch arguments.
# Build: ./build.sh, then install the .app on the booted simulator (see README.md).
appId: dev.atalanta.echo

config:
  platform: ios

tests:
  - name: launch_arguments_reach_the_app
    steps:
      - launchApp:
          appId: dev.atalanta.echo
          clearState: false
          arguments:
            isE2E: true
            retries: 3
            server: "https://example.test/a b?x=1&y=2"
      - assertVisible: { text: "args=3" }
      - assertVisible: { text: "isE2E=YES" }
      - assertVisible: { text: "retries=3" }
      - assertVisible: { text: "server=https://example.test/a b?x=1&y=2" }
      - assertVisible: { text: "default.retries=3" }
