# Held-out seeded failures, set 3. Scoring rules, written before any run:
#  correct:      the report's own words state the planted cause (right step, true reason). Cited evidence supports
#                but does not rescue words that do not commit.
#  insufficient: names the failing step but commits to no cause (including a report that offers two
#                possibilities without choosing).
#  wrong:        states a specific cause that is not the planted one, or blames another step.
#  healed:       the step healed and the test passed; record what it healed to and whether that was the intended element.
#  no-failure:   passed without healing (excluded).
# failing_step is 1-based; stopApp and launchApp count.
seeds:
  - id: holdout3_android_01
    file: android/01-services-row.yaml
    platform: android
    category: selector-typo
    seeded_cause: 'tap "Location servces" misspells the visible row "Location services" on the Location page.'
    failing_step: 6
    correct_report_says: 'The tap found no "Location servces" on the Location screen; it is a misspelling of "Location services", which is on screen.'
    wrong_report_would_say: 'The Location screen did not open, or the app is in the wrong state.'
