appId: com.android.settings
config:
  platform: android
tests:
  - name: holdout3_base_android_1
    tags: [seeded-failure-base]
    steps:
      - stopApp: { appId: com.android.settings }
      - launchApp: { appId: com.android.settings, clearState: false }
      - scrollUntilVisible: { selector: { text: "System" } }
      - tap: { text: "System" }
      - assertVisible: { text: "Languages & input" }
      - tap: { text: "Gestures" }
      - assertVisible: { text: "System navigation" }
      - assertVisible: { text: "Quickly open camera" }
      - pressKey: { key: back }
      - assertVisible: { text: "Date & time" }
