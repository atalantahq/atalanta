# Held-out seeded failures, set 2. Written blind to earlier sets, before any run.
# Scoring rules (fixed before any run), applied to the report text for the failing test:
#   correct:      the report's own words state the planted cause (right step, true reason);
#                 cited evidence supports but does not rescue words that do not commit.
#   insufficient: names the failing step but commits to no cause.
#   wrong:        states a specific cause that is not the planted one, or blames another step.
#   healed:       the step healed and the test passed; record what it healed to and whether
#                 that was the intended element.
#   no-failure:   the seed passed without healing (excluded).
# failing_step is 1-based; launchApp counts.
seeds:
  - id: "holdout2_android_01"
    file: "android/01-preferences-lookup.yaml"
    platform: "android"
    category: "selector-typo"
    seeded_cause: "Step 4 asserts 'Conection preferences' (misspelled); the real row 'Connection preferences' is on the Connected devices screen."
    failing_step: 4
    correct_report_says: "No element 'Conection preferences'; the screen has 'Connection preferences' (a misspelling of it)."
    wrong_report_would_say: "The Connected devices screen did not load, or the app is on the wrong screen."
  - id: "holdout2_android_02"
    file: "android/02-notification-access.yaml"
    platform: "android"
    category: "selector-typo"
    seeded_cause: "Step 5 taps 'Notification access', a different wording; the real row on screen is 'Device & app notifications'."
    failing_step: 5
    correct_report_says: "No element 'Notification access'; the row on screen is 'Device & app notifications' (wrong wording, not a typo)."
    wrong_report_would_say: "Still on the Settings home screen / the Notifications page never opened."
  - id: "holdout2_android_03"
    file: "android/03-cast-check.yaml"
    platform: "android"
    category: "wrong-screen"
    seeded_cause: "The tap on 'Connection preferences' (step 5 of the base) is removed, so step 5 asserts 'Cast' while still on Connected devices."
    failing_step: 5
    correct_report_says: "'Cast' is not on this screen (Connected devices); it is on Connection preferences, which was never opened because the navigation tap is missing."
    wrong_report_would_say: "'Cast' does not exist on this device / the text is misspelled."
  - id: "holdout2_android_04"
    file: "android/04-print-service-open.yaml"
    platform: "android"
    category: "wrong-screen"
    seeded_cause: "The tap on 'Connection preferences' is removed, so step 3 taps 'Printing' while on Connected devices."
    failing_step: 3
    correct_report_says: "'Printing' is not on Connected devices; it is on Connection preferences, which was skipped."
    wrong_report_would_say: "Printing is missing from this device or the tap target is wrong."
  - id: "holdout2_android_05"
    file: "android/05-summary-text.yaml"
    platform: "android"
    category: "wrong-expected-value"
    seeded_cause: "Step 8 asserts the Printing summary equals '2 print services on'; the real text is '1 print service on'."
    failing_step: 8
    correct_report_says: "The element's text is '1 print service on', not '2 print services on' (expected value wrong)."
    wrong_report_would_say: "The Printing row is missing / wrong screen."
  - id: "holdout2_android_06"
    file: "android/06-print-actions.yaml"
    platform: "android"
    category: "wrong-expected-value"
    seeded_cause: "Step 5 asserts 'Add service' is NOT visible on the Printing screen; it is visible."
    failing_step: 5
    correct_report_says: "'Add service' is visible on the Printing screen, so assertNotVisible fails (expectation wrong)."
    wrong_report_would_say: "Printing screen did not open, or 'Add service' failed to load."
  - id: "holdout2_android_07"
    file: "android/07-clock-open.yaml"
    platform: "android"
    category: "wrong-app"
    seeded_cause: "Suite appId and launchApp are the Clock app, but the steps look for Settings rows ('Connected devices')."
    failing_step: 2
    correct_report_says: "The Clock app is in front (com.google.android.deskclock), not Settings; 'Connected devices' is a Settings row."
    wrong_report_would_say: "'Connected devices' is missing from Settings / misspelled / needs scrolling."
  - id: "holdout2_android_08"
    file: "android/08-contacts-detour.yaml"
    platform: "android"
    category: "wrong-app"
    seeded_cause: "A mid-test launchApp opens Contacts (com.google.android.contacts); the next step taps the Settings row 'Notifications'."
    failing_step: 4
    correct_report_says: "Contacts app is in front after launchApp; 'Notifications' is a Settings row, so the test is in the wrong app."
    wrong_report_would_say: "The Notifications row is missing or Settings failed to launch."
  - id: "holdout2_android_09"
    file: "android/09-printing-then-cast.yaml"
    platform: "android"
    category: "stale-state"
    seeded_cause: "After tapping Printing, step 5 asserts 'Cast', a row of the Connection preferences screen that was left."
    failing_step: 5
    correct_report_says: "'Cast' belongs to the previous screen (Connection preferences); the test already navigated into Printing."
    wrong_report_would_say: "'Cast' is missing / misspelled, or Printing did not open."
  - id: "holdout2_android_10"
