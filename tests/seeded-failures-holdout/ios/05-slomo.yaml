appId: com.apple.Preferences

config:
  platform: ios

tests:
  - name: holdout_ios_05
    tags: [seeded-failure]
    steps:
      - launchApp:
          appId: com.apple.Preferences
          clearState: false
      - tap: { text: "Camera" }
      - assertVisible: { text: "Photographic Styles" }
      - tap: { text: "Record Video" }
      - assertVisible: { text: "4K at 24 FPS" }
      - assertVisible: { text: "720p HD at 30 FPS" }
      - tap: { id: "BackButton" }
      - assertText: { selector: { text: "1080p at 240 FPS" }, expected: "720p at 120 FPS" }
