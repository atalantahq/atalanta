appId: com.apple.Preferences

config:
  platform: ios

tests:
  - name: holdout_ios_01
    tags: [seeded-failure]
    steps:
      - launchApp:
          appId: com.apple.Preferences
          clearState: false
      - assertVisible: { text: "Privacy & Security" }
      - tap: { text: "Privacy & Security" }
      - assertVisible: { text: "Location Services" }
      - tap: { text: "Location Services" }
      - assertVisible: { text: "Share My Locaton" }
      - assertVisible: { text: "System Services" }
      - tap: { id: "BackButton" }
      - assertVisible: { text: "Tracking" }
