# Held-out seeded failures: manifest.
# Causes were written down before any seed was run.
#
# Scoring rules (fixed before any run):
#   correct:      the report's own words state the planted cause (right step, true
#                 reason). Evidence the report cites counts as support but does not
#                 rescue words that do not commit to the cause.
#   insufficient: names the failing step but commits to no cause.
#   wrong:        states a specific cause that is not the planted one, or blames
#                 another step.
#   healed:       the step healed and the test passed; record what it healed to.
#   no-failure:   the seed passed without healing (the seed is invalid; excluded).
#
# failing_step is 1-based and counts launchApp as step 1.
seeds:
  - id: holdout_ios_01
    file: "tests/seeded-failures-holdout/ios/01-location.yaml"
    platform: "ios"
    category: "selector-typo"
    seeded_cause: "Step 6 asserts the misspelled text 'Share My Locaton'; the real row 'Share My Location' is on screen."
    failing_step: 6
    correct_report_says: "The text 'Share My Locaton' is misspelled; the screen shows 'Share My Location' (a typo in the selector)."
    wrong_report_would_say: "The Location Services screen did not load, or the element is hidden/off-screen or needs scrolling."
  - id: holdout_ios_02
    file: "tests/seeded-failures-holdout/ios/02-camera.yaml"
    platform: "ios"
    category: "selector-typo"
    seeded_cause: "Step 4 taps the misspelled text 'Record Vidoe'; the real row 'Record Video' is on screen."
    failing_step: 4
    correct_report_says: "No element 'Record Vidoe'; the Camera screen has 'Record Video' (typo in the selector)."
    wrong_report_would_say: "The Camera screen is not open, or the tap hit the wrong screen / the app crashed."
