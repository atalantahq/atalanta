appId: com.android.settings

config:
  platform: android

tests:
  - name: base_android_1
    tags: [holdout-base]
    steps:
      - launchApp:
          appId: com.android.settings
          clearState: false
      - tap: { text: "Battery" }
      - assertVisible: { text: "Battery usage" }
      - tap: { text: "Battery Saver" }
      - assertVisible: { text: "Set a schedule" }
      - assertVisible: { text: "Turn off when charged" }
      - pressKey: { key: back }
      - assertVisible: { text: "Battery usage" }
