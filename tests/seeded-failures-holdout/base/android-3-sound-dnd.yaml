appId: com.android.settings

config:
  platform: android

tests:
  - name: base_android_3
    tags: [holdout-base]
    steps:
      - launchApp:
          appId: com.android.settings
          clearState: false
      - tap: { text: "Sound & vibration" }
      - assertVisible: { text: "Media volume" }
      - tap: { text: "Do Not Disturb" }
      - assertVisible: { text: "Schedules" }
      - assertVisible: { text: "Duration for Quick Settings" }
      - pressKey: { key: back }
      - assertVisible: { text: "Phone ringtone" }
