appId: com.android.settings

config:
  platform: android

tests:
  - name: holdout_android_04
    tags: [seeded-failure]
    steps:
      - launchApp:
          appId: com.android.settings
          clearState: false
      - tap: { text: "Battery" }
      - assertVisible: { text: "Battery usage" }
      - assertVisible: { text: "Set a schedule" }
      - assertVisible: { text: "Turn off when charged" }
      - pressKey: { key: back }
      - assertVisible: { text: "Battery usage" }
