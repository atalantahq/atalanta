# Device smoke suite for two-pane Android tablets (Settings shows its list and
# the open page side by side). It never presses back: on a tablet that leaves
# Settings and brings the app underneath to the front. Checked on a SUNMI
# tablet (Android 14), 2026-11-21.
appId: com.android.settings

config:
  platform: android
  retry:
    count: 1

tests:
  - name: settings_opens_and_switches_pages
    tags: [smoke, tablet]
    steps:
      - stopApp: {}
      - launchApp:
          appId: com.android.settings
      # The right pane opens on Network & internet, so start from another
      # page: then the tap below has to change it. Rows are anchored to the
      # list pane (the right pane repeats the page title).
      - tap: { text: "Storage", childOf: { id: "homepage_container" } }
      - assertVisible: { textContains: "GB total" }
      - assertNotVisible: { text: "Airplane mode" }
      - tap: { text: "Network & internet", childOf: { id: "homepage_container" } }
      - assertVisible: { text: "Airplane mode" }
      - assertNotVisible: { textContains: "GB total" }
