# Seeded-failure manifest. Written BEFORE any seed was run; do not edit expected
# causes after seeing output. Every suite listed here is EXPECTED TO FAIL.
#
# Scoring rules (one verdict per seed, from failures.md plus the CLI reason line):
#   correct:      the report's stated cause or its cited evidence identifies the seeded
#                 defect (right step, true reason).
#   insufficient: the report names the failing step but claims no specific cause, or
#                 says it lacks evidence.
#   wrong:        the report states a specific cause that is not the seeded one, or
#                 blames a different step.
# confidently-wrong rate = wrong / total.
# Targets from the plan: wrong <= 10%, and the cited lines contain the cause in >= 80%.
#
# failing_step is the 1-based index of the step that should fail (launchApp is step 1).
# Categories: selector-typo, wrong-screen, too-short-timeout, wrong-expected-value,
# wrong-app, stale-state. 5 seeds each; iOS 15, Android 15.

- id: ios-01
  file: ios/01-selector-typo-general.yaml
  platform: ios
  category: selector-typo
  seeded_cause: "The tap targets text 'Genral'; the row is 'General' and is on the Settings home screen."
  failing_step: 2
