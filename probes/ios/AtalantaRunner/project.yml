# Atalanta's own iOS runner (see AtalantaRunnerUITests/AtalantaRunner.swift).
# Generate and build:  xcodegen generate && xcodebuild build-for-testing \
#   -project AtalantaRunner.xcodeproj -scheme AtalantaRunner \
#   -destination 'generic/platform=iOS Simulator'
# Atalanta does this itself on first use (ATALANTA_IOS_RUNNER=atalanta).
name: AtalantaRunner
options:
  bundleIdPrefix: dev.atalanta
  deploymentTarget:
    iOS: "15.0"
targets:
  AtalantaRunnerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AtalantaRunnerUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.atalanta.runner
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
schemes:
  AtalantaRunner:
    build:
      targets:
        AtalantaRunnerUITests: [test]
    test:
      targets: [AtalantaRunnerUITests]
