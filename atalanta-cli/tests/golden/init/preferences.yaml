# yaml-language-server: $schema=./velocity.schema.json
# Starter suite written by `velocity init`. Run it: velocity run velocity/preferences.yaml
# The assertions were read from com.apple.Preferences's first screen; `velocity inspect` shows
# the live tree to pick more. Reference: docs/DSL.md (the steps and selectors).

appId: com.apple.Preferences
config:
  platform: ios
tests:
- name: preferences opens on its first screen
  tags:
  - smoke
  steps:
  - launchApp:
      appId: com.apple.Preferences
  - assertVisible:
      id: General

