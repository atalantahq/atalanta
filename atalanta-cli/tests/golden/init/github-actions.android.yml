# Example GitHub Actions workflow written by `atalanta init`.
# Copy it to .github/workflows/atalanta.yml (or run `atalanta init --ci
# github`). Two shards run through the Atalanta Action (docs/CI.md); the
# results job fails the run when a shard reported nothing.
# Pinned to v0.2.1, the Atalanta that wrote this file. Check the release
# exists (gh release view v0.2.1 -R atalantahq/atalanta) before relying on it.

name: atalanta

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      # Build or download your app here and pass it with `args: --app <path>`.
      - uses: atalantahq/atalanta@v0.2.1
        with:
          version: 0.2.1
          platform: android
          suite: atalanta
          shard: ${{ matrix.shard }}/2

  results:
    needs: ui-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Fails the run when a shard reported nothing (docs/CI.md).
      - uses: atalantahq/atalanta@v0.2.1
        with:
          version: 0.2.1
          platform: android
          check-shards: 2
