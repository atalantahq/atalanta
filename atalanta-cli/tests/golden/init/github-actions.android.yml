# Example GitHub Actions workflow written by `velocity init`.
# Copy it to .github/workflows/velocity.yml (or run `velocity init --ci
# github`). Two shards run through the Velocity Action (docs/CI.md); the
# results job fails the run when a shard reported nothing.
# Pinned to v0.2.0, the Velocity that wrote this file. Check the release
# exists (gh release view v0.2.0 -R omkar-dev/velocity) before relying on it.

name: velocity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      # Build or download your app here and pass it with `args: --app <path>`.
      - uses: omkar-dev/velocity@v0.2.0
        with:
          version: 0.2.0
          platform: android
          suite: velocity
          shard: ${{ matrix.shard }}/2

  results:
    needs: ui-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Fails the run when a shard reported nothing (docs/CI.md).
      - uses: omkar-dev/velocity@v0.2.0
        with:
          version: 0.2.0
          platform: android
          check-shards: 2
