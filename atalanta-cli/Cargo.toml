[package]
name = "atalanta-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
keywords = ["testing", "mobile", "android", "ios", "e2e"]
categories = ["development-tools::testing", "command-line-utilities"]
description = "CLI binary for Atalanta mobile testing framework"

[[bin]]
name = "atalanta"
path = "src/main.rs"

[dependencies]
atalanta-common = { workspace = true }
atalanta-android = { workspace = true }
atalanta-ios = { workspace = true }
atalanta-core = { workspace = true }
atalanta-runner = { workspace = true }
atalanta-mcp = { workspace = true }
atalanta-migrate = { workspace = true }
atalanta-inspector = { workspace = true }
atalanta-headless = { workspace = true }
atalanta-flutter-bridge = { workspace = true }
atalanta-web = { workspace = true }
atalanta-nl = { workspace = true }
atalanta-doctor = { workspace = true }
serde_yaml = { workspace = true }
atalanta-explore = { workspace = true }
atalanta-api = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
colored = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
libc = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
