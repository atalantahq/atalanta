# cargo-nextest configuration (CI runs `cargo nextest run --profile ci`).

[profile.default]
# Name tests that run long, and stop one that hangs instead of the job.
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
# Run everything, so one failure doesn't hide the others.
fail-fast = false
# A pass on retry is reported as flaky, not hidden: Velocity's own tests
# drive real headless Chrome and local sockets.
retries = 1
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"
