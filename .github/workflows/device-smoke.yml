# Device smoke tests (C5). They need a simulator or an emulator, take
# 15-30 minutes, and must never turn the regular CI red. They run:
# - nightly (row 0.2 of the v4 plan): the Android emulator (KVM, ubuntu)
#   and headless Chrome; the iOS simulator weekly (macOS minutes cost
#   about 10x Linux). The bar is 19 green nights out of 20;
# - from the Actions tab (workflow_dispatch), or with the `device-ci` label
#   on a pull request.
# They build Atalanta from this commit: until a release is published there
# is no installed binary to test (switch to the Action then).
#
# With no app given, each job drives the platform's own Settings app with a
# tiny suite (tests/smoke/*.yaml). Give `app_url` (a zipped simulator .app)
# and `suite` (a suite in this repository) to run your own app instead.
name: Device smoke

on:
  schedule:
    - cron: "17 3 * * *"   # nightly: Android + web
    - cron: "41 4 * * 1"   # Mondays: iOS too
  workflow_dispatch:
    inputs:
      app_url:
        description: "URL of a zipped iOS simulator build of an app (optional)"
        required: false
        default: ""
      suite:
        description: "Suite to run against that app (with app_url)"
        required: false
        default: "tests/smoke/ios-settings.yaml"
  pull_request:
    types: [labeled, synchronize, reopened]

# A run started by an unrelated label gets a group of its own: sharing the
# PR's group would cancel the device run in progress even though every job
# of the new run is skipped.
concurrency:
  group: device-smoke-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'device-ci' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Same toolchain as ci.yml (the release-files job there checks they agree).
  RUST_VERSION: "1.98.1"

jobs:
  ios-simulator:
    name: iOS simulator smoke
    # Another label being added is not a reason to run (or restart).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '41 4 * * 1') ||
      (contains(github.event.pull_request.labels.*.name, 'device-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'device-ci'))
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build atalanta
        run: cargo build --release -p atalanta-cli
      - name: Boot a simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,v in d.items() if "iOS" in r for x in v if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Install the app (when given)
        if: inputs.app_url != ''
        env:
          APP_URL: ${{ inputs.app_url }}
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          curl -fsSL "$APP_URL" -o app.zip
          unzip -q app.zip -d app
          xcrun simctl install "$UDID" "$(find app -name '*.app' -maxdepth 3 | head -1)"
      - name: Run the suite
        env:
          SUITE: ${{ inputs.app_url != '' && inputs.suite || 'tests/smoke/ios-settings.yaml' }}
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          ./target/release/atalanta run "$SUITE" \
            --device "$UDID" \
            --report junit,json,github --artifacts-dir atalanta-results
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-smoke-results
          path: atalanta-results
          retention-days: 7

  android-emulator:
    name: Android emulator smoke
    # Another label being added is not a reason to run (or restart).
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
      (contains(github.event.pull_request.labels.*.name, 'device-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'device-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build atalanta
        run: cargo build --release -p atalanta-cli
      - name: Run the suite on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./target/release/atalanta run tests/smoke/android-settings.yaml --report junit,json,github --artifacts-dir atalanta-results
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-smoke-results
          path: atalanta-results
          retention-days: 7

  web-headless:
    name: Web smoke (headless Chrome)
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
      (contains(github.event.pull_request.labels.*.name, 'device-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'device-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build atalanta
        run: cargo build --release -p atalanta-cli
      - name: Run the suite
        run: ./target/release/atalanta run tests/smoke/web-smoke.yaml --report junit,json,github --artifacts-dir atalanta-results
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-smoke-results
          path: atalanta-results
          retention-days: 7

  # NEW-001: a job that died before uploading must not leave the night green.
  results:
    name: Every smoke job reported
    needs: [android-emulator, web-headless]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release -p atalanta-cli
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: smoke
          pattern: "*-smoke-results"
      # Two jobs, two results files: one missing fails the night.
      - run: ./target/release/atalanta results check --expect-shards 2 smoke/android-smoke-results smoke/web-smoke-results
