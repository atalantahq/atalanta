name: Release

# A tag vX.Y.Z builds the four release binaries (the inspector web UI
# embedded), checksums and attests them, and publishes a GitHub release
# whose notes are CHANGELOG.md's `## [X.Y.Z]` section, with the rendered
# Homebrew formula attached.
#
# Assets: atalanta-<version>-<target>.tar.gz (a atalanta-<version>-<target>/
# directory holding atalanta, LICENSE, NOTICE, README.md, CHANGELOG.md),
# the CycloneDX SBOMs atalanta-<version>-{atalanta-cli,inspector-frontend}.cdx.json,
# SHA256SUMS (archives and SBOMs), SHA256SUMS.sigstore.json (its signed
# provenance attestation), atalanta.rb. install.sh, the Homebrew formula and the npm
# packages all read these names.
#
# The publish jobs (crates.io, npm, Homebrew tap) are off until the owner
# turns each on with a repository variable (Settings > Secrets and
# variables > Actions > Variables):
#   PUBLISH_CRATES=true   needs secret CARGO_REGISTRY_TOKEN
#   PUBLISH_NPM=true      needs secret NPM_TOKEN (a granular npm token with
#                         read and write on the @atalantahq scope and "Bypass
#                         2FA" ticked; npm caps write tokens at 90 days and
#                         retired automation tokens in December 2025)
#   PUBLISH_HOMEBREW=true needs secret HOMEBREW_TAP_TOKEN (contents:write on
#                         atalantahq/homebrew-tap)
# Windows is not supported, so there is no Windows build.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Same toolchain as ci.yml (the release-files job there checks they agree).
  RUST_VERSION: "1.98.1"

jobs:
  # The tag, the workspace version and the changelog must agree before
  # anything is built.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check the tag matches Cargo.toml and CHANGELOG.md
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::tag $tag does not match the workspace version $cargo_version"
            exit 1
          fi
          scripts/changelog-section.sh "$version" > /dev/null
          if grep -q "^## \[$version\] - unreleased" CHANGELOG.md; then
            echo "::error::CHANGELOG.md still says $version is unreleased; give it the release date"
            exit 1
          fi
          # The release notes are the [X.Y.Z] section only: anything still
          # under [Unreleased] would be left out of them. Fold it in first
          # (scripts/bump-version.sh X.Y.Z --date does).
          if scripts/changelog-section.sh Unreleased > /dev/null 2>&1; then
            echo "::error::CHANGELOG.md has entries under [Unreleased]; move them into [$version] (scripts/bump-version.sh $version --date)"
            exit 1
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  # The inspector's web UI, built once and embedded in every binary
  # (build.rs never runs npm).
  frontend:
    name: Inspector frontend
    needs: preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/atalanta-inspector/frontend
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 # zizmor: ignore[cache-poisoning] -- v4 caches only with `cache:`, unset
        with:
          node-version: "24"
          # No dependency cache: release inputs are fetched fresh, never
          # restored from a cache another workflow could have written.
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: test -f dist/index.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inspector-dist
          path: crates/atalanta-inspector/frontend/dist
          if-no-files-found: error

  build:
    name: Build (${{ matrix.target }})
    needs: [preflight, frontend]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # build provenance attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl binaries, cross-built with zig as the C compiler and
          # linker (ring is the only C in the tree): they run on any Linux.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zig: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            zig: true
          # Both macOS targets build on the Intel runner: the Apple silicon
          # pools (macos-latest, -14, -15, -26) stopped picking up this
          # org's jobs on 2026-11-23, while macos-15-intel still does. The
          # aarch64 binary is cross-compiled and not run here.
          - target: aarch64-apple-darwin
            os: macos-15-intel
          - target: x86_64-apple-darwin
            os: macos-15-intel
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The inspector UI is embedded at compile time from this folder.
      - name: Download inspector frontend
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: inspector-dist
          path: crates/atalanta-inspector/frontend/dist
      - name: Check the inspector frontend is in place
        shell: bash
        run: test -f crates/atalanta-inspector/frontend/dist/index.html

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      # No rust-cache here: shipped binaries are built cold, never from a
      # target/ restored from another workflow's cache.
      - name: Toolchain versions
        shell: bash
        run: |
          rustc -Vv
          cargo -V

      # Embeds the dependency list (crate names, versions, sources) in the
      # binary, so `cargo audit bin` / osv-scanner / syft can check a
      # shipped binary against advisories later (cargo-auditable).
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-auditable@0.7.7

      - name: Install zig and cargo-zigbuild
        if: matrix.zig
        shell: bash
        run: |
          python3 -m pip install --user ziglang==0.13.0.post1
          cargo install --locked cargo-zigbuild@0.24.1
          python3 -m ziglang version
          cargo install --list | grep "^cargo-zigbuild v0.24.1"

      # `atalanta version` prints these on its second line (option_env!).
      - name: Build release binary
        shell: bash
        env:
          ZIG: ${{ matrix.zig }}
        run: |
          ATALANTA_GIT_SHA=${GITHUB_SHA:0:12}
          ATALANTA_RUSTC_VERSION=$(rustc -V | cut -d' ' -f2)
          export ATALANTA_GIT_SHA ATALANTA_RUSTC_VERSION
          # `cargo auditable <cmd>` runs `cargo <cmd>` with itself as the
          # rustc workspace wrapper, so it composes with zigbuild.
          if [ "$ZIG" = "true" ]; then
            cargo auditable zigbuild --release --locked --target "$TARGET" -p atalanta-cli
          else
            cargo auditable build --release --locked --target "$TARGET" -p atalanta-cli
          fi

      - name: Check the binary
        shell: bash
        run: |
          bin="target/$TARGET/release/atalanta"
          file "$bin"
          # A binary without the UI would serve "UI not built": refuse to ship it.
          grep -aq '<title>Atalanta Inspector</title>' "$bin"
          case "$TARGET" in
            *linux-musl)
              file "$bin" | grep -Eq 'statically linked|static-pie linked' ||
                { echo "::error::$bin is not statically linked"; exit 1; } ;;
          esac
          # Run it where the runner can: the musl x86_64 build on Linux, and
          # on macOS the target matching the runner (Apple silicon would also
          # run x86_64 through Rosetta; an Intel runner cannot run aarch64).
          runnable=false
          case "$TARGET" in
            x86_64-unknown-linux-musl) runnable=true ;;
            x86_64-apple-darwin) runnable=true ;;
            aarch64-apple-darwin) [ "$(uname -m)" = arm64 ] && runnable=true ;;
          esac
          case "$runnable" in
            true)
              "$bin" --version
              "$bin" --version | grep -q "$VERSION"
              "$bin" version | sed -n 2p | grep -q "^commit ${GITHUB_SHA:0:12}," ;;
          esac

      - name: Package
        id: package
        shell: bash
        run: |
          name="atalanta-${VERSION}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/atalanta" LICENSE NOTICE README.md CHANGELOG.md "dist/$name/"
          # NOTICE points at the third-party inventories by these paths.
          mkdir -p "dist/$name/docs/licenses"
          cp docs/licenses/THIRD-PARTY-RUST.md docs/licenses/THIRD-PARTY-NPM.md "dist/$name/docs/licenses/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "archive=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  # CycloneDX SBOMs of what the binaries contain: the crates (all targets)
  # and the embedded frontend's production npm packages. Attached to the
  # release, listed in SHA256SUMS and attested with the archives.
  sbom:
    name: SBOM
    needs: preflight
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-cyclonedx@0.5.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 # zizmor: ignore[cache-poisoning] -- v4 caches only with `cache:`, unset
        with:
          node-version: "24"
      - run: scripts/sbom.sh sbom "$VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [preflight, build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Only the release tarballs: `inspector-dist` is a build input.
      - name: Download release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          pattern: atalanta-*
          merge-multiple: true
      - name: Download SBOMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sbom
          path: assets

      - name: Checksums, formula and notes
        shell: bash
        run: |
          cd assets
          count=$(find . -maxdepth 1 -name "atalanta-${VERSION}-*.tar.gz" | wc -l)
          if [ "$count" -ne 4 ]; then
            echo "::error::expected 4 archives, found $count"; ls -l; exit 1
          fi
          test -f "atalanta-${VERSION}-atalanta-cli.cdx.json" && test -f "atalanta-${VERSION}-inspector-frontend.cdx.json"
          sha256sum atalanta-*.tar.gz atalanta-*.cdx.json > SHA256SUMS
          cat SHA256SUMS
          cd ..
          scripts/render-formula.sh "$VERSION" assets/SHA256SUMS > assets/atalanta.rb
          if grep -q '0\{64\}' assets/atalanta.rb || ! grep -q "releases/download/v${VERSION}/" assets/atalanta.rb; then
            echo "::error::the rendered formula has a placeholder sha256 or no v${VERSION} URLs"; exit 1
          fi
          {
            scripts/changelog-section.sh "$VERSION"
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/v${VERSION}/install.sh | sh -s -- --version ${VERSION}"
            echo "brew install atalantahq/tap/atalanta"
            echo "npx @atalantahq/cli --version"
            echo "cargo install atalanta-cli --locked"
            echo '```'
            echo
            echo "Binaries: macOS (Apple silicon, Intel) and Linux (x86_64, arm64; static). Windows is not supported."
            echo "Check a download: \`sha256sum -c SHA256SUMS --ignore-missing\`, and its provenance: \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`. SHA256SUMS is signed by the release workflow through Sigstore: \`gh attestation verify SHA256SUMS --repo ${GITHUB_REPOSITORY}\`, or offline with \`gh attestation verify SHA256SUMS --repo ${GITHUB_REPOSITORY} --bundle SHA256SUMS.sigstore.json\`."
            echo
            echo "SBOMs (CycloneDX): \`atalanta-${VERSION}-atalanta-cli.cdx.json\` (the crates in the binary; the binaries also embed this list, readable with \`cargo audit bin\`) and \`atalanta-${VERSION}-inspector-frontend.cdx.json\` (the embedded web UI's npm packages)."
            echo
            echo "The macOS binaries are ad-hoc signed, not Developer ID signed or notarised. Installed with install.sh, brew or npm they run as is; a tarball downloaded in a browser is quarantined, and macOS asks you to approve it (System Settings > Privacy & Security), or run \`xattr -d com.apple.quarantine atalanta\` once you have checked it against SHA256SUMS."
            echo
            echo "Built with Rust ${RUST_VERSION} (the toolchain CI tests); the Linux binaries with zig 0.13.0 and cargo-zigbuild 0.24.1."
          } > notes.md

      # Provenance for the SBOMs (the archives were attested where they
      # were built), and a Sigstore-signed attestation of SHA256SUMS, which
      # vouches for every asset it lists. Its bundle ships as
      # SHA256SUMS.sigstore.json for offline verification.
      - name: Attest the SBOMs
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: assets/atalanta-*.cdx.json
      - name: Attest the checksum file
        id: attest_sums
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: assets/SHA256SUMS
      - name: Keep the checksum attestation as an asset
        env:
          BUNDLE: ${{ steps.attest_sums.outputs.bundle-path }}
        run: cp "$BUNDLE" assets/SHA256SUMS.sigstore.json

      # The runner's own gh, not a third-party action, in the one job that
      # holds contents: write.
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Atalanta ${VERSION}" \
            --notes-file notes.md \
            "${flags[@]}" \
            assets/atalanta-"${VERSION}"-*.tar.gz assets/atalanta-"${VERSION}"-*.cdx.json \
            assets/SHA256SUMS assets/SHA256SUMS.sigstore.json assets/atalanta.rb

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formula
          path: assets/atalanta.rb

  crates:
    name: Publish to crates.io
    needs: [preflight, release]
    if: vars.PUBLISH_CRATES == 'true' && needs.preflight.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # atalanta-inspector's package carries the built UI (its `include`).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: inspector-dist
          path: crates/atalanta-inspector/frontend/dist
      - run: test -f crates/atalanta-inspector/frontend/dist/index.html
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      # Every workspace crate, in dependency order; `--allow-dirty` only
      # because frontend/dist is gitignored.
      - run: cargo publish --workspace --locked --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npm:
    name: Publish to npm
    needs: [preflight, release]
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # setup-node v4 caches only with `cache:`, which is not set here.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          pattern: atalanta-*
          merge-multiple: true
      - run: node npm/assemble.mjs --version "$VERSION" --artifacts assets --out npm/dist
      # Platform packages before the launcher that depends on them.
      - name: Publish
        shell: bash
        env:
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tag=latest
          [ "$PRERELEASE" = "true" ] && tag=next
          for dir in npm/dist/cli-*/ npm/dist/cli/; do
            npm publish "$dir" --access public --provenance --tag "$tag"
          done

  homebrew:
    name: Update the Homebrew tap
    needs: [preflight, release]
    if: vars.PUBLISH_HOMEBREW == 'true' && needs.preflight.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: formula
      # The one checkout that keeps its credentials: the next step pushes
      # with them, to the tap only (HOMEBREW_TAP_TOKEN can write nothing else).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 # zizmor: ignore[artipacked]
        with:
          persist-credentials: true
          repository: atalantahq/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Commit the formula
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          mkdir -p tap/Formula
          cp atalanta.rb tap/Formula/atalanta.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/atalanta.rb
          git diff --cached --quiet && exit 0
          git commit -m "atalanta ${VERSION}"
          git push
