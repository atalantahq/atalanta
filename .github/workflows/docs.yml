# The website: the landing page and the docs, built by site/ (Astro, with
# Pagefind search) from README.md, CHANGELOG.md and docs/*.md, with
# docs/llms.txt at its root. Every pull request that touches the docs or the
# site builds it and checks the examples and generated pages; a published
# release deploys it to GitHub Pages (Settings > Pages > Source: GitHub
# Actions). The repository variables SITE_URL and SITE_BASE_PATH set the
# address it is built for (default https://atalanta.sh at /; a project page
# without a custom domain needs SITE_BASE_PATH=/atalanta/).
name: Docs

on:
  pull_request:
    paths: ["docs/**", "site/**", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", "Cargo.toml", "Cargo.lock", "crates/atalanta-core/src/schema.rs", "crates/atalanta-wasm/**", ".github/workflows/docs.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Same toolchain as ci.yml (the release-files job there checks they agree).
  RUST_VERSION: "1.98.1"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
      # Pull requests only: the site a release deploys is built cold, never
      # from a cache another workflow could have written.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 # zizmor: ignore[cache-poisoning] -- skipped on release
        if: github.event_name == 'pull_request'
        with:
          shared-key: docs
      # Every suite example in the README and docs/*.md parses and
      # validates; DSL-REFERENCE.md, MCP.md and llms.txt match the code.
      - name: Snippet and generated-page checks
        run: |
          cargo test -p atalanta-core --locked --test doc_examples --test dsl_reference --test llms_txt
          cargo test -p atalanta-mcp-server --locked --lib the_mcp_doc_lists_every_tool
      # No npm cache: like the Rust cache above, the site a release deploys
      # is built cold. `npm ci` installs exactly site/package-lock.json.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 # zizmor: ignore[cache-poisoning] -- v4 caches only with `cache:`, unset
        with:
          node-version: "24"
      # The playground's validator: atalanta-core as WebAssembly. The
      # wasm-bindgen CLI must match the crate version in Cargo.lock.
      - name: Read the wasm-bindgen version
        id: wbg
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-bindgen@${{ steps.wbg.outputs.version }}
      - name: Build the playground validator
        run: |
          cargo build -p atalanta-wasm --target wasm32-unknown-unknown --release --locked
          wasm-bindgen --target web --out-dir site/public/playground/wasm target/wasm32-unknown-unknown/release/atalanta_wasm.wasm
      # A relative link to a file that does not exist, or a docs page missing
      # from the sidebar config, fails this build.
      - name: Build the site
        working-directory: site
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://atalanta.sh' }}
          BASE_PATH: ${{ vars.SITE_BASE_PATH || '/' }}
        run: |
          npm ci
          npm run build
      # External links only (the build already fails on broken internal ones).
      # Reported in the job summary; a dead third-party link never blocks a PR.
      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: false
          jobSummary: true
          args: >-
            --no-progress --scheme https --max-concurrency 8
            --accept 200..=299,403,429
            --exclude '^https://atalanta\.sh'
            --exclude '^https://github\.com/atalantahq/atalanta/(edit|issues/new)'
            'site/dist/**/*.html'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/dist

  deploy:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
