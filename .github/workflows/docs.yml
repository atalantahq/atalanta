# The docs site (row 0.8 of the v4 plan): mdBook over docs/, with search and
# docs/llms.txt at its root. Every pull request that touches the docs builds
# it and checks the examples and generated pages; a published release
# deploys it to GitHub Pages (Settings > Pages > Source: GitHub Actions).
name: Docs

on:
  pull_request:
    paths: ["docs/**", "README.md", "crates/velocity-core/src/schema.rs", ".github/workflows/docs.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Same toolchain as ci.yml (the release-files job there checks they agree).
  RUST_VERSION: "1.98.1"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      # Pull requests only: the site a release deploys is built cold, never
      # from a cache another workflow could have written.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 # zizmor: ignore[cache-poisoning] -- skipped on release
        if: github.event_name == 'pull_request'
        with:
          shared-key: docs
      # Every suite example in the README and docs/*.md parses and
      # validates; DSL-REFERENCE.md, MCP.md and llms.txt match the code.
      - name: Snippet and generated-page checks
        run: |
          cargo test -p velocity-core --locked --test doc_examples --test dsl_reference --test llms_txt
          cargo test -p velocity-mcp-server --locked --lib the_mcp_doc_lists_every_tool
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: mdbook@0.4.52
      - run: mdbook build docs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: target/docs-site

  deploy:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
