# API tests over real TLS on Linux: examples/api-tls against go-httpbin
# behind Caddy with a mkcert certificate (trusted through SSL_CERT_FILE, the
# way users with a private CA do it), then against httpbin.org.
name: API over TLS

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-tls-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.98.1"
  MKCERT_VERSION: v1.4.4
  MKCERT_SHA256: 6d31c65b03972c6dc4a14ab429f2928300518b26503f58723e532d1b0a3bbb52
  CADDY_IMAGE: caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
  HTTPBIN_IMAGE: mccutchen/go-httpbin:2.26.0@sha256:873b4fdb27fe7cc66fa12cb9362574e1b0bf31df7ca8a71b2502988327a0b8a4

jobs:
  tls:
    name: API suite over TLS (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: api-tls
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build atalanta
        run: |
          cargo build --release --locked -p atalanta-cli
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      - name: Make a CA and a localhost certificate
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mkcert" \
            "https://github.com/FiloSottile/mkcert/releases/download/$MKCERT_VERSION/mkcert-$MKCERT_VERSION-linux-amd64"
          echo "$MKCERT_SHA256  $RUNNER_TEMP/mkcert" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/mkcert"
          export CAROOT="$RUNNER_TEMP/ca"
          mkdir -p "$CAROOT" "$RUNNER_TEMP/certs"
          "$RUNNER_TEMP/mkcert" -cert-file "$RUNNER_TEMP/certs/cert.pem" \
            -key-file "$RUNNER_TEMP/certs/key.pem" localhost 127.0.0.1
          chmod 644 "$RUNNER_TEMP/certs/key.pem"
          cat /etc/ssl/certs/ca-certificates.crt "$CAROOT/rootCA.pem" > "$RUNNER_TEMP/bundle.pem"

      - name: Start go-httpbin behind Caddy on https://localhost:8443
        run: |
          cat > "$RUNNER_TEMP/Caddyfile" <<'CADDY'
          {
            auto_https disable_redirects
          }
          https://localhost:8443 {
            tls /certs/cert.pem /certs/key.pem
            reverse_proxy httpbin:8080
          }
          CADDY
          docker network create tls
          docker run -d --name httpbin --network tls "$HTTPBIN_IMAGE"
          docker run -d --name caddy --network tls -p 8443:8443 \
            -v "$RUNNER_TEMP/certs:/certs:ro" \
            -v "$RUNNER_TEMP/Caddyfile:/etc/caddy/Caddyfile:ro" "$CADDY_IMAGE"
          for _ in $(seq 30); do
            curl -fsS --cacert "$RUNNER_TEMP/ca/rootCA.pem" https://localhost:8443/get >/dev/null && exit 0
            sleep 1
          done
          echo "::error::Caddy never served https://localhost:8443"
          exit 1

      - name: Without the CA the certificate is refused
        env:
          API_URL: https://localhost:8443
        run: |
          if atalanta run examples/api-tls --artifacts-dir "$RUNNER_TEMP/untrusted"; then
            echo "::error::the suite passed against a certificate nothing trusts"
            exit 1
          fi

      - name: Local TLS (mkcert + Caddy)
        env:
          API_URL: https://localhost:8443
        run: |
          SSL_CERT_FILE="$RUNNER_TEMP/bundle.pem" atalanta run examples/api-tls \
            --parallel 2 --report junit,json,github --artifacts-dir atalanta-results/local

      # httpbin.org is often slow or down: three tries before it counts.
      - name: Public TLS (httpbin.org)
        env:
          API_URL: https://httpbin.org
        run: |
          for try in 1 2 3; do
            SSL_CERT_FILE="$RUNNER_TEMP/bundle.pem" atalanta run examples/api-tls \
              --parallel 2 --report junit,json,github --artifacts-dir "atalanta-results/public-$try" && exit 0
            [ "$try" -lt 3 ] && sleep 20
          done
          exit 1

      - name: Server logs
        if: failure()
        run: |
          docker logs caddy || true
          docker logs httpbin || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: api-tls-results
          path: atalanta-results
          retention-days: 14
          if-no-files-found: ignore
