# The Flutter bridge's Dart package against the SDK floor (3.19, D-15/D-41)
# and the current stable (C5). Opt-in: workflow_dispatch, or the
# `flutter-ci` label on a pull request.
name: Flutter bridge

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

jobs:
  dart:
    name: Dart bridge (Flutter ${{ matrix.flutter }})
    # Another label being added is not a reason to run (or restart).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'flutter-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'flutter-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - flutter: "3.19.6"
            channel: stable
          - flutter: ""
            channel: stable
    defaults:
      run:
        working-directory: crates/velocity-flutter-bridge/dart
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: ${{ matrix.channel }}
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  rust:
    name: Rust bridge client
    # Another label being added is not a reason to run (or restart).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'flutter-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'flutter-ci'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p velocity-flutter-bridge
