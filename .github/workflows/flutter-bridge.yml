# The Flutter bridge's Dart package against the SDK floor (3.19, D-15/D-41)
# and the current stable (C5). Opt-in: workflow_dispatch, or the
# `flutter-ci` label on a pull request.
name: Flutter bridge

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

env:
  # Same toolchain as ci.yml (the release-files job there checks they agree).
  RUST_VERSION: "1.98.1"

jobs:
  dart:
    name: Dart bridge (Flutter ${{ matrix.flutter }})
    # Another label being added is not a reason to run (or restart).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'flutter-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'flutter-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - flutter: "3.19.6"
            channel: stable
          - flutter: ""
            channel: stable
    defaults:
      run:
        working-directory: crates/atalanta-flutter-bridge/dart
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: ${{ matrix.channel }}
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  rust:
    name: Rust bridge client
    # Another label being added is not a reason to run (or restart).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'flutter-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'flutter-ci'))
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test -p atalanta-flutter-bridge
