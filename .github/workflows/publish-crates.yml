name: Publish crates

# Publishes a release tag's workspace crates to crates.io, for when
# release.yml's crates job failed after the GitHub release was made (a
# token without publish-new, an expired token). Safe to run again: crates
# already on crates.io at that version are skipped. crates.io takes 5 new
# crates at once, then 1 every 10 minutes, so a first publish of all of
# them waits out the limit and takes about two hours.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-crates
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Same toolchain as ci.yml (the release-files job there checks they agree).
  RUST_VERSION: "1.98.1"

jobs:
  crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "24"
      # atalanta-inspector's package carries the built UI (its `include`).
      - name: Build the inspector UI
        working-directory: crates/atalanta-inspector/frontend
        run: |
          npm ci
          npm run build
          test -f dist/index.html
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Publish
        env:
          TAG: ${{ inputs.tag }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          workspace=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$version" != "$workspace" ]; then
            echo "::error::tag $TAG, but Cargo.toml says $workspace"; exit 1
          fi
          mapfile -t packages < <(cargo metadata --no-deps --locked --format-version 1 |
            jq -r '.packages[] | select(.publish != []) | .name')
          agent="atalanta publish-crates workflow (https://github.com/atalantahq/atalanta)"
          # Every package is verified before the first upload, so a retry
          # after a rate limit only uploads.
          verify=()
          for attempt in $(seq 30); do
            exclude=()
            for p in "${packages[@]}"; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -A "$agent" "https://crates.io/api/v1/crates/$p/$version")
              case $code in
                200) exclude+=(--exclude "$p") ;;
                404) ;;
                *) echo "::error::crates.io answered $code for $p $version"; exit 1 ;;
              esac
            done
            left=$((${#packages[@]} - ${#exclude[@]} / 2))
            echo "attempt $attempt: $left of ${#packages[@]} crates to publish"
            [ "$left" -gt 0 ] || exit 0
            if cargo publish --workspace --locked --allow-dirty "${verify[@]}" "${exclude[@]}" 2>&1 | tee publish.log; then
              continue
            fi
            after=$(sed -n 's/.*Please try again after \(.* GMT\).*/\1/p' publish.log | head -n 1)
            [ -n "$after" ] || exit 1
            wait=$(($(date -d "$after" +%s) - $(date +%s) + 15))
            [ "$wait" -gt 15 ] || wait=15
            echo "crates.io rate limit: waiting ${wait}s, until $after"
            sleep "$wait"
            verify=(--no-verify)
          done
          echo "::error::crates still unpublished after 30 attempts"; exit 1
