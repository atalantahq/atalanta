name: Install smoke

# After a release, install it every way the README advertises, on Linux and
# macOS, and check each install really works: `atalanta --version` names the
# release, and an API-only suite (http steps only, so no device) passes
# against a local `python3 -m http.server`.
#
# Routes and the names they use (from release.yml, install.sh,
# scripts/render-formula.sh, npm/cli/package.json, atalanta-cli/Cargo.toml):
#   install.sh  raw.githubusercontent.com/<repo>/main/install.sh --version X
#   Homebrew    tap atalantahq/atalanta (repo atalantahq/homebrew-tap),
#               formula atalantahq/tap/atalanta
#   npm         @atalantahq/cli (launcher; per-platform binaries in
#               @atalantahq/cli-<os>-<cpu>)
#   crates.io   atalanta-cli (binary `atalanta`)
#
# release.yml publishes npm, crates.io and the tap only when the repository
# variables PUBLISH_NPM / PUBLISH_CRATES / PUBLISH_HOMEBREW are 'true', and
# skips crates.io and Homebrew for prereleases; the matching jobs here are
# gated the same way. Those publishes run after the GitHub release exists,
# so each job first waits for its channel to carry the version.
#
# release.yml creates the release with the default GITHUB_TOKEN, and events
# made with GITHUB_TOKEN start no other workflow, so `release: published`
# fires only for a release a person publishes. `workflow_run` on Release is
# what runs this after every tagged release (its head_branch is the tag).

on:
  # Only completed Release runs started by a tag push in this repository
  # are acted on (the `version` job's `if:`); nothing from the triggering
  # run is checked out or downloaded, and the version is validated.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Release]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release to check (X.Y.Z, with or without a leading v)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: install-smoke-${{ github.event.workflow_run.head_branch || github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

env:
  # The checks every route runs. $ATALANTA is the command that runs the
  # installed atalanta (word-split on purpose: the npm route is `npx ...`);
  # $VERSION is the release.
  SMOKE_SH: |
    set -euo pipefail
    echo "::group::atalanta --version"
    out=$($ATALANTA --version)
    echo "$out"
    got=$(printf '%s\n' "$out" | awk 'NR == 1 { print $2 }')
    if [ "$got" != "$VERSION" ]; then
      echo "::error::atalanta --version printed '$out', expected version $VERSION"
      exit 1
    fi
    echo "::endgroup::"

    echo "::group::API-only suite against a local HTTP server"
    work=$(mktemp -d)
    mkdir -p "$work/site"
    printf '{"status":"ok","version":"%s","items":[{"sku":"A1","qty":2},{"sku":"B2","qty":1}]}\n' "$VERSION" > "$work/site/health.json"
    cat > "$work/api-smoke.yaml" <<'YAML'
    config:
      http:
        baseUrl: "http://127.0.0.1:8765"
        timeoutMs: 5000
    tests:
      - name: Serves the JSON file
        steps:
          - name: Harden the runner
            uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
            with:
              egress-policy: audit
          - http:
              url: /health.json
              expect:
                status: 200
                headers: { content-type: { contains: json } }
                json:
                  status: ok
                  version: "${ATALANTA_EXPECT_VERSION}"
                  items: { length: 2 }
                  items[0].sku: A1
                  items[0].qty: { gt: 0 }
                maxMs: 5000
              capture: { FIRST_SKU: "items[0].sku" }
          - http:
              url: /health.json
              query: { sku: "${FIRST_SKU}" }
              expect:
                status: 200
                json:
                  "$.items[*].sku": { contains: B2 }
      - name: A missing file is a 404
        steps:
          - name: Harden the runner
            uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
            with:
              egress-policy: audit
          - http:
              url: /missing.json
              expect: { status: 404 }
    YAML
    python3 -m http.server 8765 --bind 127.0.0.1 --directory "$work/site" > "$work/server.log" 2>&1 &
    server=$!
    trap 'kill "$server" 2>/dev/null || true' EXIT
    for _ in $(seq 1 50); do
      curl -fsS -o /dev/null http://127.0.0.1:8765/health.json 2>/dev/null && break
      sleep 0.2
    done
    curl -fsS http://127.0.0.1:8765/health.json
    cd "$work"
    ATALANTA_EXPECT_VERSION="$VERSION" $ATALANTA run api-smoke.yaml
    echo "::endgroup::"

jobs:
  version:
    name: Resolve version
    # A failed release published nothing to check. A workflow_run can also
    # come from a pull request whose branch carries a workflow named
    # Release: only a tag push in this repository counts.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - id: v
        shell: bash
        env:
          RAW: ${{ github.event.workflow_run.head_branch || github.event.release.tag_name || inputs.version }}
        run: |
          version="${RAW#v}"
          # X.Y.Z or X.Y.Z-pre: digits, dots, letters and dashes only (the
          # value is used in URLs, file names and GITHUB_OUTPUT).
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$RAW' is not a version (X.Y.Z)"; exit 1
          fi
          # Same rule as release.yml's preflight.
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Checking Atalanta $version (prerelease: $prerelease)"

  install-sh:
    name: install.sh (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      # The release assets are uploaded before the release is published, so
      # nothing to wait for. The script is the one the README pipes from main.
      # Exactly what the README tells users to run; install.sh checks the
      # archive against the release's SHA256SUMS before installing it.
      - name: Install with install.sh
        shell: bash
        # nosemgrep: yaml.github-actions.security.gha-curl-pipe-shell.gha-curl-pipe-shell
        run: | # zizmor: ignore[github-env] -- only a fixed RUNNER_TEMP path goes to GITHUB_PATH
          set -euo pipefail
          dir="$RUNNER_TEMP/atalanta-bin"
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh" |
            sh -s -- --version "$VERSION" --dir "$dir" --no-modify-path
          echo "$dir" >> "$GITHUB_PATH"
      - name: Smoke test
        shell: bash
        env:
          ATALANTA: atalanta
        run: bash -c "$SMOKE_SH"

  homebrew:
    name: Homebrew (${{ matrix.os }})
    needs: version
    if: vars.PUBLISH_HOMEBREW == 'true' && needs.version.outputs.prerelease == 'false'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      # ubuntu-latest ships Homebrew at /home/linuxbrew but not on PATH.
      - name: Put brew on PATH (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: | # zizmor: ignore[github-env] -- only the runner image's brew directory
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          dirname "$(command -v brew)" >> "$GITHUB_PATH"
      # release.yml's homebrew job pushes Formula/atalanta.rb to the tap after
      # the release; wait until it points at this version. The tap's default
      # branch is assumed to be `main` (inferred: release.yml just pushes).
      - name: Wait for the tap to carry ${{ env.VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/atalantahq/homebrew-tap/main/Formula/atalanta.rb"
          for i in $(seq 1 40); do
            if curl -fsSL "$url?nocache=$i" 2>/dev/null | grep -q "/releases/download/v${VERSION}/"; then
              echo "tap formula is at $VERSION"; exit 0
            fi
            echo "tap not at $VERSION yet ($i/40)"; sleep 30
          done
          echo "::error::the tap formula never reached $VERSION"; exit 1
      - name: Install with Homebrew
        shell: bash
        run: |
          set -euo pipefail
          brew tap atalantahq/atalanta
          brew install atalantahq/tap/atalanta
          brew test atalantahq/tap/atalanta
      - name: Smoke test
        shell: bash
        env:
          ATALANTA: atalanta
        run: bash -c "$SMOKE_SH"

  npm:
    name: npm (${{ matrix.os }})
    needs: version
    # Prereleases are published too (dist-tag `next`); npx asks for the exact
    # version, so the dist-tag does not matter here.
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4.4.0 # zizmor: ignore[cache-poisoning] -- v4 caches only with `cache:`, unset here
        with:
          node-version: "24"
      # The launcher is published last, after the platform packages.
      - name: Wait for @atalantahq/cli@${{ env.VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            if [ "$(npm view "@atalantahq/cli@${VERSION}" version 2>/dev/null)" = "$VERSION" ]; then
              echo "on npm"; exit 0
            fi
            echo "not on npm yet ($i/40)"; sleep 30
          done
          echo "::error::@atalantahq/cli@$VERSION never appeared on npm"; exit 1
      - name: Smoke test
        shell: bash
        env:
          ATALANTA: npx --yes @atalantahq/cli@${{ needs.version.outputs.version }}
        run: bash -c "$SMOKE_SH"

  cargo:
    name: cargo install (${{ matrix.os }})
    needs: version
    if: vars.PUBLISH_CRATES == 'true' && needs.version.outputs.prerelease == 'false'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      # Floating stable on purpose: what a user running `cargo install` has
      # (the release binaries themselves are built with RUST_VERSION).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      # `cargo publish --workspace` uploads atalanta-cli last; wait for it to
      # be in the index.
      - name: Wait for atalanta-cli ${{ env.VERSION }} on crates.io
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            if curl -fsS -A "atalanta-install-smoke (github.com/${GITHUB_REPOSITORY})" \
                 "https://crates.io/api/v1/crates/atalanta-cli/${VERSION}" >/dev/null 2>&1; then
              echo "on crates.io"; exit 0
            fi
            echo "not on crates.io yet ($i/40)"; sleep 30
          done
          echo "::error::atalanta-cli $VERSION never appeared on crates.io"; exit 1
      - name: cargo install
        shell: bash
        run: |
          set -euo pipefail
          # The sparse index can lag the API by a little; retry once.
          cargo install atalanta-cli --version "$VERSION" --locked ||
            { sleep 60; cargo install atalanta-cli --version "$VERSION" --locked; }
      - name: Smoke test
        shell: bash
        env:
          ATALANTA: atalanta
        run: bash -c "$SMOKE_SH"
