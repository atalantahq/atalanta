# Build and check the in-app probes with their own toolchains (C5): cargo
# never builds them. Opt-in: workflow_dispatch, or the `probes-ci` label on
# a pull request.
name: Probes

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

jobs:
  android:
    name: Android probes (javac host checks, d8, Gradle)
    # Another label being added is not a reason to run (or restart).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'probes-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'probes-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install the SDK platform and build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Sync probe host checks
        run: probes/android/velocity-sync-probe/host-check.sh
      - name: Tree server (host checks + dex jar)
        run: probes/android/velocity-tree-server/build.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Sync probe Gradle build (Kotlin + Java)
        working-directory: probes/android/velocity-sync-probe
        run: |
          # The probe ships as sources (no wrapper or settings): a throwaway
          # settings file pins the Android and Kotlin plugins for this build.
          cat > settings.gradle.kts <<'KTS'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
              plugins {
                  id("com.android.library") version "8.3.2"
                  id("org.jetbrains.kotlin.android") version "1.9.23"
              }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "velocity-sync-probe"
          KTS
          echo "android.useAndroidX=true" > gradle.properties
          gradle assembleRelease --no-daemon

  ios:
    name: iOS probes (swiftc host checks, xcodebuild)
    # Another label being added is not a reason to run (or restart).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'probes-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'probes-ci'))
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Sync probe host checks
        run: probes/ios/VelocitySyncProbe/HostChecks/run.sh
      - name: Sync probe package (iOS Simulator)
        working-directory: probes/ios/VelocitySyncProbe
        run: xcodebuild -scheme VelocitySyncProbe -destination 'generic/platform=iOS Simulator' build
      - name: VelocityRunner (build for testing)
        working-directory: probes/ios/VelocityRunner
        run: |
          xcodebuild -project VelocityRunner.xcodeproj -scheme VelocityRunner \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build-for-testing
