# Build and check the in-app probes with their own toolchains (C5): cargo
# never builds them. Opt-in: workflow_dispatch, or the `probes-ci` label on
# a pull request.
name: Probes

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

jobs:
  android:
    name: Android probes (javac host checks, d8, Gradle)
    # Another label being added is not a reason to run (or restart).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'probes-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'probes-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tree server's platform, build-tools and JDK are pinned in its
      # toolchain.env (the committed jar is built with exactly those).
      - name: Read the pinned toolchain
        id: pins
        run: grep -E '^TREE_[A-Z_]+=' probes/android/atalanta-tree-server/toolchain.env >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ steps.pins.outputs.TREE_JDK }}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The default also installs `tools`, which newer SDKs no longer have
          # (sdkmanager exits 1: "Failed to find package 'tools'").
          packages: platform-tools
      - name: Install the SDK platforms and build tools
        env:
          PLATFORM: ${{ steps.pins.outputs.TREE_PLATFORM }}
          BUILD_TOOLS: ${{ steps.pins.outputs.TREE_BUILD_TOOLS }}
        # android-34 + 34.0.0 for the sync probe's Gradle build.
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platforms;$PLATFORM" "build-tools;$BUILD_TOOLS"
      - name: Sync probe host checks
        run: probes/android/atalanta-sync-probe/host-check.sh
      - name: Tree server jar reproduces from source
        run: scripts/check-tree-jar.sh
      # build.sh overwrites the committed jar in this checkout: it must come
      # out identical.
      - name: Tree server (host checks + dex jar) matches the committed jar
        run: |
          probes/android/atalanta-tree-server/build.sh
          git diff --exit-code --stat -- crates/atalanta-android/assets/atalanta-tree.jar
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.7"
      - name: Sync probe Gradle build (Kotlin + Java)
        working-directory: probes/android/atalanta-sync-probe
        run: |
          # The probe ships as sources (no wrapper or settings): a throwaway
          # settings file pins the Android and Kotlin plugins for this build.
          cat > settings.gradle.kts <<'KTS'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
              plugins {
                  id("com.android.library") version "8.3.2"
                  id("org.jetbrains.kotlin.android") version "1.9.23"
              }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "atalanta-sync-probe"
          KTS
          echo "android.useAndroidX=true" > gradle.properties
          gradle assembleRelease --no-daemon

  ios:
    name: iOS probes (swiftc host checks, xcodebuild)
    # Another label being added is not a reason to run (or restart).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'probes-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'probes-ci'))
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync probe host checks
        run: probes/ios/AtalantaSyncProbe/HostChecks/run.sh
      - name: Sync probe package (iOS Simulator)
        working-directory: probes/ios/AtalantaSyncProbe
        run: xcodebuild -scheme AtalantaSyncProbe -destination 'generic/platform=iOS Simulator' build
      - name: AtalantaRunner (build for testing)
        working-directory: probes/ios/AtalantaRunner
        run: |
          xcodebuild -project AtalantaRunner.xcodeproj -scheme AtalantaRunner \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build-for-testing
