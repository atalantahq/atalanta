[workspace]
resolver = "2"
members = [
    "crates/atalanta-common",
    "crates/atalanta-android",
    "crates/atalanta-ios",
    "crates/atalanta-core",
    "crates/atalanta-runner",
    "crates/atalanta-mcp",
    "crates/atalanta-migrate",
    "crates/atalanta-headless",
    "crates/atalanta-inspector",
    "crates/atalanta-flutter-bridge",
    "crates/atalanta-web",
    "crates/atalanta-nl",
    "crates/atalanta-doctor",
    "crates/atalanta-explore",
    "crates/atalanta-api",
    "atalanta-cli",
]
# cargo-fuzz targets: their own workspace and lockfile, built with nightly
# (fuzz/Cargo.toml), never by `cargo build` here.
# `crates/atalanta-adapter` is a parked prototype of the adapter plugin
# system (docs/research/v4/PLAN-v5-ship-adapters-worlds.md §4). It does not
# build yet and stays out of the workspace until plan v5's §3.10 gate is met.
exclude = ["fuzz", "crates/atalanta-adapter"]

[workspace.package]
version = "0.2.0"
edition = "2021"
# The oldest toolchain Atalanta builds with (`File::lock` needs 1.89; clippy's
# incompatible_msrv lint flags newer std APIs);
# `cargo install` on an older one fails with a clear message.
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/atalantahq/atalanta"
homepage = "https://github.com/atalantahq/atalanta"
readme = "README.md"
authors = ["omkar-dev"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# rustls instead of the platform TLS: no OpenSSL to link or ship on Linux.
# Roots: Mozilla's bundled set plus the OS trust store
# (`rustls-tls-native-roots`; SSL_CERT_FILE / SSL_CERT_DIR, when set,
# replace the OS store), so a corporate or mitmproxy CA the machine trusts
# works.
# Proxies come from HTTP(S)_PROXY / ALL_PROXY, minus NO_PROXY.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "http2", "charset"] }
quick-xml = { version = "0.41", features = ["serialize"] }
regex = "1"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
colored = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
rust-embed = { version = "8" }
mime_guess = "2"
# Declared once here; crates use `{ workspace = true }`.
libc = "0.2"
tempfile = "3"
png = "0.18.1"
sha2 = "0.10"
ring = "0.17"

# The workspace's own crates. Published together (`cargo publish --workspace`),
# so each path dependency also carries the version crates.io resolves it to.
# The MCP crate is published as `atalanta-mcp-server` and keeps its
# `atalanta_mcp` library name.
atalanta-common = { path = "crates/atalanta-common", version = "=0.2.0" }
atalanta-android = { path = "crates/atalanta-android", version = "=0.2.0" }
atalanta-ios = { path = "crates/atalanta-ios", version = "=0.2.0" }
atalanta-core = { path = "crates/atalanta-core", version = "=0.2.0" }
atalanta-runner = { path = "crates/atalanta-runner", version = "=0.2.0" }
atalanta-mcp = { package = "atalanta-mcp-server", path = "crates/atalanta-mcp", version = "=0.2.0" }
atalanta-migrate = { path = "crates/atalanta-migrate", version = "=0.2.0" }
atalanta-headless = { path = "crates/atalanta-headless", version = "=0.2.0" }
atalanta-inspector = { path = "crates/atalanta-inspector", version = "=0.2.0" }
atalanta-flutter-bridge = { path = "crates/atalanta-flutter-bridge", version = "=0.2.0" }
atalanta-web = { path = "crates/atalanta-web", version = "=0.2.0" }
atalanta-nl = { path = "crates/atalanta-nl", version = "=0.2.0" }
atalanta-doctor = { path = "crates/atalanta-doctor", version = "=0.2.0" }
atalanta-explore = { path = "crates/atalanta-explore", version = "=0.2.0" }
atalanta-api = { path = "crates/atalanta-api", version = "=0.2.0" }

# Every crate opts in with `[lints] workspace = true`. Only lints with no
# false positives here: CI runs clippy with `-D warnings`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
# `cargo fuzz` builds with `--cfg fuzzing` (fuzz/, tree_server::fuzzing).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
await_holding_lock = "deny"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# One static binary: size and startup matter more than build time here.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Install-by-hash reads the whole app build; unoptimized SHA-256 runs at
# ~40 MB/s, optimized at several hundred.
[profile.dev.package.sha2]
opt-level = 3
