# Measurement suite for scripts/measure/native-settle.sh (P5): settle time
# per action with the in-app sync probe (sync.mode native) against tree
# polling and no sync. The script prints each step's median settleMs per
# mode.
#
# Native sync needs an app built with VelocitySyncProbe (iOS) or
# velocity-sync-probe (Android): set APP_ID, MEASURE_TAP and
# MEASURE_BACK_TO for it (FRAMEWORK=react_native for an RN app). Against
# the default Settings app "native" falls back to polling, which the
# script reports. Not run by CI: needs a device.
appId: com.android.settings

config:
  platform: android
  retry:
    count: 0
  sync:
    mode: auto

tests:
  - name: native_settle_times
    tags: [measure]
    steps:
      - launchApp:
          appId: com.android.settings
          clearState: false
      - assertVisible: { textContains: "${MEASURE_BACK_TO:-Network}" }
      - tap: { textContains: "${MEASURE_TAP:-Network}" }
      - pressKey: { key: back }
      - assertVisible: { textContains: "${MEASURE_BACK_TO:-Network}" }
      - swipe: { direction: up }
      - swipe: { direction: down }
      - tap: { textContains: "${MEASURE_TAP:-Network}" }
      - pressKey: { key: back }
      - assertVisible: { textContains: "${MEASURE_BACK_TO:-Network}" }
